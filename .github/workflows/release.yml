name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Build and test the tagged version
        env:
          TAG: ${{ github.ref_name }}
        run: ./gradlew --no-daemon --no-configuration-cache build -Pmod_version="${TAG#v}"
      - name: Publish mod jar and changelog notes
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash .github/scripts/release.sh
