plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.mod_id
}

loom {
	// Client-only code lives in src/client; server code cannot reach it.
	splitEnvironmentSourceSets()

	mods {
		register(project.mod_id) {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

fabricApi {
	// Generated advancements and item models (src/datagen → src/main/generated), run with ./gradlew runDatagen.
	configureDataGeneration {
		createSourceSet = true
		modId = "${project.mod_id}-datagen"
		client = true
		strictValidation = true
	}

	// In-game tests (src/gametest), run with ./gradlew runGameTest.
	configureTests {
		createSourceSet = true
		modId = "${project.mod_id}-gametest"
		enableGameTests = true
		enableClientGameTests = true
		eula = true
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// TOML for config/alayacore.toml; packed inside the jar so players install nothing extra.
	include(implementation("com.electronwill.night-config:core:${project.night_config_version}"))
	include(implementation("com.electronwill.night-config:toml:${project.night_config_version}"))

	// Rule classes are plain Java and are tested without starting the game.
	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
	toolchain.languageVersion = JavaLanguageVersion.of(project.java_version as int)
	withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release = project.java_version as int
}

test {
	useJUnitPlatform()
}

processResources {
	def props = [
		version          : project.version,
		mod_id           : project.mod_id,
		loader_version   : project.loader_version,
		minecraft_version: project.minecraft_version,
		java_version     : project.java_version
	]
	inputs.properties props

	filesMatching('fabric.mod.json') {
		expand props
	}
}

jar {
	def modId = project.mod_id
	from('LICENSE') {
		rename { "${it}_${modId}" }
	}
}

publishing {
	publications {
		create('mavenJava', MavenPublication) {
			artifactId = project.mod_id
			from components.java
		}
	}
}
